plugins {
    id 'com.android.application'
}

android {
    compileSdk 33
    namespace "com.gura.hexconverter"

    defaultConfig {
        applicationId "com.gura.hexconverter"
        minSdk 19
        targetSdk 33
        versionCode 2
        versionName "2.0"
    }
    
    // Release signing is optional: provide these environment variables
    // (e.g. from GitHub Secrets) to sign release builds. Never commit a keystore.
    def ksFile = System.getenv("KEYSTORE_FILE")

    if (ksFile) {
        signingConfigs {
            release {
                storeFile file(ksFile)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (ksFile) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
}
